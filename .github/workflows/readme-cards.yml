name: Update README cards

# The public Vercel instances of github-readme-stats, github-profile-trophy,
# github-readme-activity-graph and github-contributor-stats are disabled
# (HTTP 402/503), so the cards are generated here and committed to profile/.
# If a source fails, the previously committed card is kept.

on:
  schedule:
    - cron: "30 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/readme-cards.yml

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Optional: add a PAT with `repo` + `read:user` scopes as the STATS_TOKEN
      # secret so private contributions are counted. Falls back to GITHUB_TOKEN.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=tokyonight&locale=en&hide_border=false
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&locale=en&hide_title=false&langs_count=8&theme=tokyonight&hide_border=false&card_width=500&layout=compact&hide=jupyter%20notebook
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Fetch trophy, activity graph and contributor cards
        env:
          USER_NAME: ${{ github.repository_owner }}
        run: |
          # fetch <output> <query> <host>...  — tries each host until one returns a real SVG
          fetch() {
            local out="$1" query="$2"; shift 2
            for host in "$@"; do
              if curl -sfL -m 30 -o "$out.tmp" "$host$query" \
                 && [ "$(wc -c < "$out.tmp")" -gt 1000 ] \
                 && head -c 500 "$out.tmp" | grep -q '<svg' \
                 && ! grep -qiE 'something went wrong|rate limit' "$out.tmp"; then
                mv "$out.tmp" "$out"; echo "✓ $out from $host"; return 0
              fi
              echo "✗ $host"
            done
            rm -f "$out.tmp"; echo "::warning::all sources failed for $out, keeping previous version"
          }

          fetch profile/trophy.svg \
            "/?username=$USER_NAME&theme=tokyonight&column=-1&row=1&margin-w=8&margin-h=8&no-bg=false&no-frame=false" \
            https://github-profile-trophy.vercel.app \
            https://github-profile-repo.vercel.app \
            https://github-profile-trophy-unserori.vercel.app \
            https://github-trophy-jagratadeb.vercel.app

          fetch profile/activity-graph.svg \
            "/graph?username=$USER_NAME&radius=16&theme=tokyo-night&area=true" \
            https://github-readme-activity-graph.vercel.app \
            https://github-readme-activity-graph.guany.me \
            https://github-readme-activity-graph-sarang.vercel.app \
            https://hritik-github-readme-activity-graph.vercel.app

          fetch profile/contributor-stats.svg \
            "/api?username=$USER_NAME&limit=5&theme=tokyonight&combine_all_yearly_contributions=true" \
            https://github-contributor-stats.vercel.app \
            https://repository-contribution-stats.vercel.app

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "chore: update README cards"
          git pull --rebase
          git push
